<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-copy">
        <h1>Mergington High School</h1>
        <h2>Extracurricular Activities</h2>
      </div>
      <div class="account-controls">
        <button id="account-button" class="account-button" type="button" aria-label="Teacher account menu" aria-expanded="false" aria-controls="account-menu" title="Teacher account menu">
          <span aria-hidden="true">&#128100;</span>
        </button>
        <span id="account-status" aria-live="polite">Student view</span>
        <div id="account-menu" class="account-menu hidden">
          <button id="account-action" type="button">Log in</button>
        </div>
      </div>
    </header>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <h2 id="login-title">Teacher login</h2>
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <p id="login-message" class="hidden" role="alert"></p>
        <div class="dialog-actions">
          <button id="cancel-login" class="secondary-button" type="button">Cancel</button>
          <button type="submit">Log in</button>
        </div>
      </form>
    </dialog>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Register a Student</h3>
        <p id="teacher-only-note">Teacher login is required to manage registrations. Activity rosters are visible to students.</p>
        <form id="signup-form" hidden>
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Register Student</button>
        </form>
        <div id="message" class="hidden" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
